<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-label="Comparison of an ungrounded prompt that fills missing facts with plausible guesses versus a grounded prompt that links answers to source text or outputs Not stated">
  <defs>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="0.5" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#495f7a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e71d6"/>
    </marker>
    <marker id="arrowMag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bd35c2"/>
    </marker>
  </defs>

  <!-- TOP ROW: Ungrounded prompt leading to hallucinated gap fill -->
  <text x="16" y="42" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">UNGROUNDED</text>

  <!-- Bare query token box -->
  <rect x="120" y="18" width="160" height="38" rx="5" fill="#082445"/>
  <text x="200" y="41" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12">Query only (no source)</text>

  <!-- Dashed gap representing missing context -->
  <line x1="286" y1="37" x2="450" y2="37" stroke="#495f7a" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowMuted)"/>
  <rect x="320" y="12" width="96" height="20" rx="3" fill="none" stroke="#495f7a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="368" y="26" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11">missing facts</text>
  <text x="368" y="56" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11">plausible token guess</text>

  <!-- Fabricated output -->
  <rect x="460" y="18" width="276" height="38" rx="5" fill="none" stroke="#bd35c2" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="598" y="41" text-anchor="middle" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="12">Confident but fabricated detail (?)</text>

  <!-- Divider -->
  <line x1="16" y1="82" x2="744" y2="82" stroke="#495f7a" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- BOTTOM ROW: Grounded source text + quote verification + escape hatch -->
  <text x="16" y="148" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">GROUNDED</text>

  <!-- Source document with document lines and highlighted quote span -->
  <rect x="120" y="102" width="190" height="104" rx="6" fill="#082445"/>
  <text x="134" y="122" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">&lt;policy_source&gt;</text>
  <rect x="134" y="132" width="150" height="6" rx="2" fill="#495f7a"/>
  <rect x="134" y="145" width="118" height="16" rx="3" fill="#1e71d6"/>
  <text x="193" y="157" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">&quot;within 30 days&quot;</text>
  <rect x="134" y="168" width="160" height="6" rx="2" fill="#495f7a"/>
  <rect x="134" y="181" width="96" height="6" rx="2" fill="#495f7a"/>
  <text x="134" y="200" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">&lt;/policy_source&gt;</text>

  <!-- Upper branch: fact present in source -->
  <path d="M 310 153 L 450 128" fill="none" stroke="#1e71d6" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="380" y="128" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">fact in text</text>

  <rect x="460" y="104" width="276" height="40" rx="5" fill="url(#groundGrad)"/>
  <text x="598" y="128" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Answer + exact quote: &quot;within 30 days&quot;</text>

  <!-- Lower branch: fact absent in source -> escape hatch -->
  <path d="M 310 175 L 450 186" fill="none" stroke="#bd35c2" stroke-width="2" marker-end="url(#arrowMag)"/>
  <text x="380" y="198" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">fact absent</text>

  <rect x="460" y="166" width="276" height="40" rx="5" fill="#082445" stroke="#bd35c2" stroke-width="2"/>
  <text x="598" y="190" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Escape hatch: &quot;Not stated in source&quot;</text>
</svg>
